<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Налаштування</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #f3f4f6);
                color: var(--tg-theme-text-color, #000000);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            }

            /* Стиль для красивого тумблера */
            .toggle-checkbox:checked {
                right: 0;
                border-color: #3b82f6;
            }
            .toggle-checkbox:checked + .toggle-label {
                background-color: #3b82f6;
            }
            .toggle-checkbox {
                right: 4px;
                z-index: 1;
                border-color: #e5e7eb;
                transition: all 0.3s;
            }
            .toggle-label {
                width: 3rem;
                height: 1.5rem;
                background-color: #e5e7eb;
                border-radius: 9999px;
                transition: all 0.3s;
            }
        </style>
    </head>
    <body class="p-5 antialiased transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-extrabold mb-6">⚙️ Налаштування</h1>

            <div
                class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 mb-4 flex justify-between items-center"
            >
                <div>
                    <p class="text-xs font-bold uppercase opacity-60">
                        Поточна група
                    </p>
                    <p class="text-lg font-bold" id="groupName">
                        Завантаження...
                    </p>
                </div>
            </div>

            <div
                class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 flex justify-between items-center"
            >
                <div>
                    <p class="font-bold text-lg">🔔 Ранковий розклад</p>
                    <p class="text-sm opacity-60">Отримувати розклад о 07:30</p>
                </div>

                <div
                    class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in"
                >
                    <input
                        type="checkbox"
                        name="toggle"
                        id="notifToggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
                        onchange="saveSettings()"
                    />
                    <label
                        for="notifToggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"
                    ></label>
                </div>
            </div>

            <p class="text-center text-xs opacity-50 mt-6" id="saveStatus"></p>
            <div
                class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 mt-4"
            >
                <p class="font-bold mb-2 text-lg">✉️ Написати Адміну</p>
                <p class="text-xs opacity-60 mb-3">
                    Знайшли помилку в розкладі? Напишіть нам!
                </p>

                <textarea
                    id="feedbackMsg"
                    rows="3"
                    class="w-full p-3 rounded-xl bg-black/5 border border-gray-500/20 outline-none focus:border-blue-500 mb-2 text-sm transition-colors"
                    placeholder="Опишіть проблему..."
                ></textarea>

                <button
                    id="feedbackBtn"
                    onclick="sendFeedback()"
                    class="tg-btn w-full py-2.5 rounded-xl font-bold shadow-md text-sm transition-opacity"
                >
                    Відправити
                </button>
            </div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const userId = tg.initDataUnsafe?.user?.id || "0";

            // Завантажуємо налаштування при відкритті
            async function loadSettings() {
                try {
                    const res = await fetch(`/api/settings?userId=${userId}`);
                    const data = await res.json();

                    document.getElementById("groupName").innerText = data.group;
                    document.getElementById("notifToggle").checked =
                        data.notifications;
                } catch (e) {
                    document.getElementById("groupName").innerText = "Помилка";
                }
            }

            // Зберігаємо, коли користувач клацає тумблер
            async function saveSettings() {
                const isChecked =
                    document.getElementById("notifToggle").checked;
                const statusText = document.getElementById("saveStatus");
                statusText.innerText = "Збереження...";

                try {
                    await fetch("/api/settings", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            userId: userId,
                            notifications: isChecked,
                        }),
                    });
                    statusText.innerText = "✅ Збережено";
                    setTimeout(() => (statusText.innerText = ""), 2000);
                } catch (e) {
                    statusText.innerText = "❌ Помилка збереження";
                }
            }

            // Відправляємо відгук адміну
            async function sendFeedback() {
                const msg = document.getElementById("feedbackMsg").value;
                const btn = document.getElementById("feedbackBtn");
                const statusText = document.getElementById("saveStatus");

                if (!msg.trim()) {
                    tg.showAlert("Введіть текст повідомлення!");
                    return;
                }

                btn.disabled = true;
                btn.innerText = "⏳ Відправка...";
                btn.classList.add("opacity-50");

                try {
                    const response = await fetch("/api/feedback", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userId: userId, message: msg }),
                    });

                    if (response.ok) {
                        statusText.innerText = "✅ Відгук надіслано адміну!";
                        document.getElementById("feedbackMsg").value = "";
                        setTimeout(() => (statusText.innerText = ""), 3000);
                    } else {
                        statusText.innerText = "❌ Помилка відправки";
                    }
                } catch (e) {
                    statusText.innerText = "❌ Помилка з'єднання";
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Відправити";
                    btn.classList.remove("opacity-50");
                }
            }

            loadSettings();
        </script>
    </body>
</html>
