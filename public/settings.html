<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nalashtuvannya</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #f3f4f6);
                color: var(--tg-theme-text-color, #000000);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            }
        </style>
    </head>
    <body class="p-5 antialiased transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-extrabold mb-6">⚙️ Налаштування</h1>

            <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 mb-4 flex justify-between items-center">
                <div>
                    <p class="text-xs font-bold uppercase opacity-60">Поточна група</p>
                    <p class="text-lg font-bold" id="groupName">Завантаження...</p>
                </div>
            </div>

            <p class="text-center text-xs opacity-50 mt-4" id="saveStatus"></p>

            <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 mt-4">
                <p class="font-bold mb-2 text-lg">✉️ Написати Адміну</p>
                <p class="text-xs opacity-60 mb-3">Знайшли помилку в розкладі? Напишіть нам!</p>

                <textarea
                    id="feedbackMsg"
                    rows="3"
                    class="w-full p-3 rounded-xl bg-black/5 border border-gray-500/20 outline-none focus:border-blue-500 mb-2 text-sm transition-colors"
                    placeholder="Опишіть проблему..."
                ></textarea>

                <button
                    id="feedbackBtn"
                    onclick="sendFeedback()"
                    class="w-full py-2.5 rounded-xl font-bold shadow-md text-sm bg-blue-600 hover:bg-blue-700 text-white transition-opacity"
                >
                    Відправити
                </button>
            </div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const userId = tg.initDataUnsafe?.user?.id || "0";

            async function loadSettings() {
                try {
                    const res = await fetch(`/api/settings?userId=${userId}`);
                    const data = await res.json();
                    document.getElementById("groupName").innerText = data.group || "Не обрано";
                } catch (e) {
                    document.getElementById("groupName").innerText = "Помилка";
                }
            }

            async function sendFeedback() {
                const msg = document.getElementById("feedbackMsg").value;
                const btn = document.getElementById("feedbackBtn");
                const statusText = document.getElementById("saveStatus");

                if (!msg.trim()) {
                    tg.showAlert("Введіть текст повідомлення!");
                    return;
                }

                btn.disabled = true;
                btn.innerText = "⏳ Відправка...";
                btn.classList.add("opacity-50");

                try {
                    const response = await fetch("/api/feedback", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userId: userId, message: msg }),
                    });

                    if (response.ok) {
                        statusText.innerText = "✅ Відгук��A�слано адміну!";
                        document.getElementById("feedbackMsg").value = "";
                        setTimeout(() => (statusText.innerText = ""), 3000);
                    } else {
                        statusText.innerText = "❌ Помилка відправки";
                    }
                } catch (e) {
                    statusText.innerText = "❌ Помилка з'єєднання";
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Відправити";
                    btn.classList.remove("opacity-50");
                }
            }

            loadSettings();
        </script>
    </body>
</html>
