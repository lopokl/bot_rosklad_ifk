<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Бот Розкладу</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Roboto", sans-serif;
            }
        </style>
    </head>
    <body
        class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4"
    >
        <div
            class="bg-gray-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-gray-700"
        >
            <div
                class="w-24 h-24 mx-auto bg-blue-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-lg shadow-blue-500/50"
            >
                🤖
            </div>

            <h1
                class="text-3xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300"
            >
                Розклад ІФК
            </h1>

            <p class="text-gray-400 mb-8 leading-relaxed">
                Швидкий, зручний та автоматизований доступ до розкладу занять
                прямо у твоєму Telegram. Ніколи більше не питай "А яка зараз
                пара?".
            </p>

            <a
                href="https://t.me/debilroskladbot"
                target="_blank"
                class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-2xl transition-all duration-300 transform hover:scale-105 shadow-lg shadow-blue-500/30"
            >
                Додати в Telegram
            </a>
        </div>

        <p class="mt-8 text-gray-500 text-sm">Розроблено з ❤️ для студентів</p>
    </body>
</html>
