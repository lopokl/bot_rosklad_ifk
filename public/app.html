<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Розклад занять — ІФК</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        <style>
            * {
                font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            }
            body {
                background-color: var(--tg-theme-bg-color, #0f172a);
                color: var(--tg-theme-text-color, #f8fafc);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #1e293b);
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #3b82f6);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            select option {
                background-color: #1e293b;
                color: #ffffff;
            }
            @media print {
                body {
                    background-color: #ffffff !important;
                    color: #000000 !important;
                }
                .no-print {
                    display: none !important;
                }
                .tg-card {
                    background-color: #ffffff !important;
                    border: 1px solid #cbd5e1 !important;
                    box-shadow: none !important;
                    break-inside: avoid;
                }
            }
        </style>
    </head>
    <body class="p-4 md:p-6 lg:p-8 antialiased min-h-screen selection:bg-blue-500 selection:text-white">
        <div class="max-w-6xl mx-auto">
            <!-- ВЕРХНЯ ПАНЕЛЬ (HEADER) ДЛЯ МОБІЛКИ ТА ПК -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-6 border-b border-slate-700/50">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🎓</span>
                            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                                Привіт, <span id="userName" class="text-blue-400">Студент</span>!
                            </h1>
                        </div>
                        <p class="text-xs md:text-sm text-slate-400 mt-1 flex items-center gap-2" id="dateHeader">
                            <span>Завантаження розкладу...</span>
                        </p>
                    </div>

                    <!-- Мобільна кнопка вибору групи -->
                    <button onclick="openGroupModal()" class="md:hidden flex items-center gap-2 p-2.5 px-3 bg-blue-500/10 border border-blue-500/30 rounded-xl text-blue-400 font-bold text-sm">
                        <span id="groupNameMobile">Група...</span>
                        <span class="text-xs">⚙️</span>
                    </button>
                </div>

                <!-- ДЕСКТОП-ПАНЕЛЬ КЕРУВАННЯ (ПК ВЕРСІЯ) -->
                <div class="flex items-center flex-wrap gap-2.5 no-print">
                    <!-- Вибір групи на десктопі -->
                    <div class="hidden md:flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 p-1.5 px-3 rounded-xl cursor-pointer hover:border-blue-500/50 transition-colors" onclick="openGroupModal()">
                        <span class="text-xs uppercase font-bold text-slate-400">Група:</span>
                        <span id="groupNameDesktop" class="font-extrabold text-blue-400 text-base">Завантаження...</span>
                        <span class="text-xs text-slate-400">✏️</span>
                    </div>

                    <!-- Перемикач День / Весь тиждень -->
                    <div class="hidden md:flex bg-slate-800/90 p-1 rounded-xl border border-slate-700/60 text-xs font-bold">
                        <button id="viewModeDayBtn" onclick="switchViewMode('day')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm transition-all">
                            📅 День
                        </button>
                        <button id="viewModeWeekBtn" onclick="switchViewMode('week')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all">
                            🗓 Весь тиждень
                        </button>
                    </div>

                    <!-- Годинник та індикатор -->
                    <div id="liveClockBadge" class="hidden lg:flex items-center gap-1.5 bg-slate-800/60 border border-slate-700/50 px-3 py-2 rounded-xl text-xs font-mono text-slate-300">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                        <span id="liveClock">--:--:--</span>
                    </div>

                    <!-- Кнопка оновлення даних -->
                    <button onclick="reloadCurrentSchedule()" title="Оновити дані" class="p-2 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-200 transition-colors">
                        🔄
                    </button>
                </div>
            </header>

            <!-- НАВІГАЦІЯ ПО ДНЯХ ТИЖНЯ -->
            <div id="daysNavBar" class="flex space-x-2 overflow-x-auto pb-3 mb-6 scrollbar-hide no-print">
                <button onclick="selectDay('mon')" id="btn_mon" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    Понеділок
                </button>
                <button onclick="selectDay('tue')" id="btn_tue" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    Вівторок
                </button>
                <button onclick="selectDay('wed')" id="btn_wed" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    Середа
                </button>
                <button onclick="selectDay('thu')" id="btn_thu" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    Четвер
                </button>
                <button onclick="selectDay('fri')" id="btn_fri" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    П'ятниця
                </button>
                <button onclick="selectDay('sat')" id="btn_sat" class="day-btn tg-card px-5 py-2.5 rounded-2xl whitespace-nowrap font-bold text-sm border border-slate-700/60">
                    Субота
                </button>
            </div>

            <!-- ІНФОРМАЦІЙНИЙ БАНЕР ПОТОЧНОЇ ПАРИ -->
            <div id="currentPairStatusBanner" class="hidden mb-6 p-4 rounded-2xl bg-gradient-to-r from-blue-900/40 to-slate-800/60 border border-blue-500/30 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-2xl animate-bounce">⚡</span>
                    <div>
                        <p class="text-xs uppercase font-extrabold text-blue-400 tracking-wider">Зараз іде пара</p>
                        <h4 id="currentPairStatusName" class="font-bold text-base md:text-lg text-white">--</h4>
                    </div>
                </div>
                <div class="text-right">
                    <span id="currentPairStatusTime" class="text-xs font-mono bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full border border-blue-500/40">--:--</span>
                </div>
            </div>

            <!-- ГЛОБАЛЬНИЙ БАНЕР ОГОЛОШЕННЯ -->
            <div id="globalBanner" class="hidden mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm flex items-center gap-3">
                <span class="text-xl">📢</span>
                <span id="globalBannerText" class="font-medium"></span>
            </div>

            <!-- ОСНОВНА ОБЛАСТЬ: ДЕННИЙ ВИГЛЯД (SINGLE DAY) -->
            <main id="dayViewContainer" class="space-y-4">
                <div id="scheduleLoading" class="text-center py-16">
                    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mb-4"></div>
                    <p class="text-slate-400 font-medium text-sm">Синхронізація з розкладом коледжу...</p>
                </div>
                <div id="scheduleCards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </main>

            <!-- ОСНОВНА ОБЛАСТЬ: СІТКА НА ВЕСЬ ТИЖДЕНЬ (ДЛЯ ПК) -->
            <main id="weekViewContainer" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="weekGridContent">
                    <!-- Заповнюється динамічно через renderWeekGrid() -->
                </div>
            </main>
        </div>

        <!-- МОДАЛЬНЕ ВІКНО ВИБОРУ ГРУПИ -->
        <div id="groupModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="tg-card w-full max-w-md rounded-3xl p-6 border border-slate-700/80 shadow-2xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">Оберіть вашу групу</h3>
                    <button onclick="closeGroupModal()" class="text-slate-400 hover:text-white text-xl p-1">&times;</button>
                </div>
                <p class="text-xs text-slate-400 mb-4">Розклад завантажиться автоматично для вашої групи.</p>

                <div class="space-y-3 mb-6">
                    <select id="modalGroupSelect" class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-blue-500 text-sm font-semibold">
                        <option value="">Завантаження списку груп...</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button onclick="saveSelectedGroupFromModal()" class="tg-btn w-full py-3.5 rounded-xl font-bold text-sm shadow-lg hover:brightness-110 transition-all">
                        Зберегти групу
                    </button>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНЕ ВІКНО НОТАТОК ДО ПАРИ (ДЗ) -->
        <div id="notesModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="tg-card w-full max-w-md rounded-3xl p-6 border border-slate-700/80 shadow-2xl">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-lg font-bold flex items-center gap-2">
                        <span>📝</span> Нотатки / ДЗ
                    </h3>
                    <button onclick="closeNotesModal()" class="text-slate-400 hover:text-white text-xl p-1">&times;</button>
                </div>
                <p id="notesSubjectTitle" class="text-sm font-semibold text-blue-400 mb-3">Предмет</p>

                <textarea
                    id="notesTextarea"
                    rows="4"
                    class="w-full p-3 rounded-xl bg-slate-800/90 border border-slate-700 outline-none focus:border-blue-500 text-sm mb-4"
                    placeholder="Запишіть домашнє завдання, посилання чи дедлайн..."
                ></textarea>

                <div class="flex gap-2">
                    <button onclick="saveNotes()" class="tg-btn w-full py-3 rounded-xl font-bold text-sm shadow-md">
                        Зберегти
                    </button>
                    <button onclick="closeNotesModal()" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm">
                        Скасувати
                    </button>
                </div>
            </div>
        </div>

        <script>
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();
                tg.ready();
            }

            const daysMap = {
                mon: "Понеділок",
                tue: "Вівторок",
                wed: "Середа",
                thu: "Четвер",
                fri: "П'ятниця",
                sat: "Субота",
            };

            let currentUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "0";
            let currentDay = "mon";
            let currentViewMode = "day";
            let userSelectedGroup = localStorage.getItem("student_group") || "";
            let currentNotesSubject = "";

            if (tg?.initDataUnsafe?.user) {
                document.getElementById("userName").textContent = tg.initDataUnsafe.user.first_name || "Студент";
            }

            function getTodayDayKey() {
                const dayIndex = new Date().getDay();
                const map = { 1: "mon", 2: "tue", 3: "wed", 4: "thu", 5: "fri", 6: "sat" };
                return map[dayIndex] || "mon";
            }
            currentDay = getTodayDayKey();

            function updateClock() {
                const now = new Date();
                const clockEl = document.getElementById("liveClock");
                if (clockEl) {
                    clockEl.textContent = now.toLocaleTimeString("uk-UA", { timeZone: "Europe/Kyiv" });
                }
            }
            setInterval(updateClock, 1000);
            updateClock();

            // Гарячі клавіші для ПК
            window.addEventListener("keydown", (e) => {
                if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
                const days = ["mon", "tue", "wed", "thu", "fri", "sat"];
                if (e.key >= "1" && e.key <= "6") {
                    selectDay(days[parseInt(e.key, 10) - 1]);
                } else if (e.key === "ArrowLeft") {
                    const idx = days.indexOf(currentDay);
                    if (idx > 0) selectDay(days[idx - 1]);
                } else if (e.key === "ArrowRight") {
                    const idx = days.indexOf(currentDay);
                    if (idx < days.length - 1) selectDay(days[idx + 1]);
                } else if (e.key.toLowerCase() === "w") {
                    switchViewMode(currentViewMode === "day" ? "week" : "day");
                }
            });

            async function checkAppStatus() {
                try {
                    const res = await fetch("/api/app-status");
                    if (!res.ok) return true;
                    const config = await res.json();

                    if (config.maintenance) {
                        document.body.innerHTML = `
                            <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-900 text-white">
                                <span class="text-7xl mb-6">🛠</span>
                                <h2 class="text-2xl font-extrabold mb-2">Технічні роботи</h2>
                                <p class="text-slate-400 max-w-sm mb-6">Зараз ми оновлюємо розклад. Спробуйте пізніше!</p>
                            </div>
                        `;
                        return false;
                    }

                    if (config.banner) {
                        const bannerEl = document.getElementById("globalBanner");
                        const textEl = document.getElementById("globalBannerText");
                        if (bannerEl && textEl) {
                            textEl.textContent = config.banner;
                            bannerEl.classList.remove("hidden");
                        }
                    }
                } catch (e) {
                    console.log("Status check skipped");
                }
                return true;
            }

            async function initUserGroup() {
                try {
                    if (currentUserId && currentUserId !== "0") {
                        const res = await fetch(`/api/settings?userId=${currentUserId}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data.group && data.group !== "Не обрано") {
                                userSelectedGroup = data.group;
                                localStorage.setItem("student_group", userSelectedGroup);
                            }
                        }
                    }
                } catch (e) {
                    console.log("Settings fetch fallback:", e);
                }

                if (!userSelectedGroup) {
                    userSelectedGroup = localStorage.getItem("student_group") || "";
                }

                updateGroupLabels();

                if (!userSelectedGroup) {
                    openGroupModal();
                } else {
                    loadScheduleForDay(currentDay);
                }
            }

            function updateGroupLabels() {
                const text = userSelectedGroup || "Оберіть групу";
                document.getElementById("groupNameMobile").textContent = text;
                document.getElementById("groupNameDesktop").textContent = text;
            }

            async function loadGroupsList() {
                const select = document.getElementById("modalGroupSelect");
                try {
                    const res = await fetch("/api/groups");
                    const data = await res.json();
                    if (data.groups && data.groups.length > 0) {
                        select.innerHTML = data.groups
                            .map((g) => `<option value="${g}" ${g === userSelectedGroup ? "selected" : ""}>${g}</option>`)
                            .join("");
                    } else {
                        select.innerHTML = `<option value="306-К">306-К</option><option value="307-К">307-К</option>`;
                    }
                } catch (e) {
                    select.innerHTML = `<option value="306-К">306-К</option><option value="307-К">307-К</option>`;
                }
            }

            function openGroupModal() {
                loadGroupsList();
                document.getElementById("groupModal").classList.remove("hidden");
            }

            function closeGroupModal() {
                document.getElementById("groupModal").classList.add("hidden");
            }

            async function saveSelectedGroupFromModal() {
                const select = document.getElementById("modalGroupSelect");
                const chosen = select.value;
                if (!chosen) return;

                userSelectedGroup = chosen;
                localStorage.setItem("student_group", chosen);
                updateGroupLabels();
                closeGroupModal();

                if (currentUserId && currentUserId !== "0") {
                    try {
                        await fetch("/api/save-group", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ userId: currentUserId, group: chosen }),
                        });
                    } catch (e) {}
                }

                loadScheduleForDay(currentDay);
            }

            function selectDay(dayKey) {
                currentDay = dayKey;
                document.querySelectorAll(".day-btn").forEach((btn) => {
                    btn.classList.remove("bg-blue-600", "text-white", "border-blue-500");
                    btn.classList.add("text-slate-300");
                });
                const activeBtn = document.getElementById(`btn_${dayKey}`);
                if (activeBtn) {
                    activeBtn.classList.add("bg-blue-600", "text-white", "border-blue-500");
                    activeBtn.classList.remove("text-slate-300");
                }

                if (currentViewMode === "day") {
                    loadScheduleForDay(dayKey);
                }
            }

            async function loadScheduleForDay(dayKey) {
                if (!userSelectedGroup) {
                    openGroupModal();
                    return;
                }

                const loadingEl = document.getElementById("scheduleLoading");
                const cardsContainer = document.getElementById("scheduleCards");
                const dateHeader = document.getElementById("dateHeader");

                loadingEl.classList.remove("hidden");
                cardsContainer.innerHTML = "";
                dateHeader.innerHTML = `<span>Синхронізація розкладу...</span>`;

                try {
                    const uName = encodeURIComponent(tg?.initDataUnsafe?.user?.username || "");
                    const fName = encodeURIComponent(tg?.initDataUnsafe?.user?.first_name || "Студент");
                    const url = `/api/get-schedule?day=${dayKey}&group=${encodeURIComponent(userSelectedGroup)}&userId=${currentUserId}&username=${uName}&name=${fName}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    loadingEl.classList.add("hidden");

                    if (data.error) {
                        dateHeader.innerHTML = `<span class="font-bold text-slate-200">${daysMap[dayKey] || ""}</span>`;
                        cardsContainer.innerHTML = `
                            <div class="col-span-full tg-card p-8 rounded-3xl text-center border border-slate-700">
                                <span class="text-4xl block mb-3">⚠️</span>
                                <h3 class="font-bold text-base mb-1">Повідомлення</h3>
                                <p class="text-xs text-slate-400 mb-4">${data.error}</p>
                                <button onclick="openGroupModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all">
                                    Обрати іншу групу
                                </button>
                            </div>
                        `;
                        return;
                    }

                    dateHeader.innerHTML = `
                        <span class="font-bold text-slate-200">${daysMap[dayKey] || ""}</span>
                        ${data.date ? `<span class="text-blue-400 font-mono">📅 ${data.date}</span>` : ""}
                        ${data.studyMode ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${data.isOnSite ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" : "bg-sky-500/20 text-sky-300 border border-sky-500/30"}">${data.studyMode}</span>` : ""}
                    `;

                    const pairsList = data.pairs || data.schedule || [];
                    renderPairs(pairsList);
                } catch (e) {
                    loadingEl.classList.add("hidden");
                    dateHeader.innerHTML = `<span class="font-bold text-slate-200">${daysMap[dayKey] || ""}</span>`;
                    cardsContainer.innerHTML = `
                        <div class="col-span-full tg-card p-8 rounded-3xl text-center border border-slate-700">
                            <span class="text-4xl block mb-3">📡</span>
                            <h3 class="font-bold text-base mb-1">Помилка з'єднання</h3>
                            <p class="text-xs text-slate-400">Перевірте інтернет або спробуйте пізніше.</p>
                        </div>
                    `;
                }
            }

            function renderPairs(pairs) {
                const container = document.getElementById("scheduleCards");
                container.innerHTML = "";

                if (!pairs || pairs.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full tg-card p-10 rounded-3xl text-center border border-slate-700/60">
                            <span class="text-5xl block mb-3">🎉</span>
                            <h3 class="font-bold text-lg mb-1">Пар немає!</h3>
                            <p class="text-xs text-slate-400">У цей день занять не заплановано, можна відпочивати.</p>
                        </div>
                    `;
                    return;
                }

                pairs.forEach((pair) => {
                    const pairNumber = pair.number || pair.pair || "1";
                    const pairName = pair.subject || pair.name || "";
                    const pairAud = pair.room || pair.aud || "Не вказано";
                    const isFree = !pairName || pairName === "Немає" || pairName === "-";

                    const card = document.createElement("div");

                    if (isFree) {
                        card.className = "tg-card p-4 rounded-3xl border border-slate-800/80 opacity-50";
                        card.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-400 border border-slate-700">
                                        ${pairNumber}
                                    </span>
                                    <span class="text-xs font-mono text-slate-500">${pair.time || ""}</span>
                                </div>
                                <span class="text-xs text-slate-500 font-medium">Вільна пара ☕</span>
                            </div>
                        `;
                    } else {
                        card.className = "tg-card p-5 rounded-3xl border border-slate-700/70 hover:border-blue-500/50 transition-all";
                        card.innerHTML = `
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-xl flex items-center justify-center font-extrabold text-xs bg-blue-600 text-white shadow-sm">
                                        ${pairNumber}
                                    </span>
                                    <span class="text-xs font-mono font-semibold text-slate-400">${pair.time || ""}</span>
                                </div>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-blue-400 border border-slate-700">
                                    ${pair.type || "🧩 Пара"}
                                </span>
                            </div>

                            <h4 class="font-bold text-base md:text-lg mb-2 text-slate-100">${pairName}</h4>

                            <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/80 mt-3">
                                <span class="flex items-center gap-1.5 font-medium text-slate-300">
                                    <span>👨‍🏫</span> ${pair.teacher || "За розкладом"}
                                </span>
                                <span class="font-mono px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-slate-200">
                                    📍 ${pairAud}
                                </span>
                            </div>
                        `;
                    }

                    container.appendChild(card);
                });
            }

            function switchViewMode(mode) {
                currentViewMode = mode;
                const dayBtn = document.getElementById("viewModeDayBtn");
                const weekBtn = document.getElementById("viewModeWeekBtn");
                const dayContainer = document.getElementById("dayViewContainer");
                const weekContainer = document.getElementById("weekViewContainer");
                const daysBar = document.getElementById("daysNavBar");

                if (mode === "week") {
                    dayBtn.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
                    weekBtn.className = "px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm transition-all";
                    dayContainer.classList.add("hidden");
                    weekContainer.classList.remove("hidden");
                    daysBar.classList.add("hidden");
                    renderWeekGrid();
                } else {
                    dayBtn.className = "px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm transition-all";
                    weekBtn.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition-all";
                    dayContainer.classList.remove("hidden");
                    weekContainer.classList.add("hidden");
                    daysBar.classList.remove("hidden");
                    loadScheduleForDay(currentDay);
                }
            }

            async function renderWeekGrid() {
                const container = document.getElementById("weekGridContent");
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-3"></div>
                        <p class="text-sm text-slate-400">Завантаження розкладу на тиждень...</p>
                    </div>
                `;

                const days = ["mon", "tue", "wed", "thu", "fri", "sat"];
                const results = await Promise.allSettled(
                    days.map((d) =>
                        fetch(`/api/get-schedule?day=${d}&group=${encodeURIComponent(userSelectedGroup)}`).then((r) => r.json())
                    )
                );

                container.innerHTML = "";
                days.forEach((dayKey, idx) => {
                    const res = results[idx];
                    const data = res.status === "fulfilled" ? res.value : null;
                    const rawPairs = data?.pairs || data?.schedule || [];
                    const activePairs = rawPairs.filter((p) => (p.subject || p.name) && (p.subject || p.name) !== "Немає");

                    const dayCol = document.createElement("div");
                    dayCol.className = "tg-card p-4 rounded-3xl border border-slate-700/60";

                    let pairsHtml = "";
                    if (activePairs.length === 0) {
                        pairsHtml = `<p class="text-xs text-slate-500 py-6 text-center">Пар немає</p>`;
                    } else {
                        pairsHtml = activePairs
                            .map((p) => `
                                <div class="p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/40 mb-2">
                                    <div class="flex justify-between items-center text-[11px] text-slate-400 mb-1">
                                        <span class="font-bold text-blue-400">${p.number || p.pair} пара (${p.time})</span>
                                        <span>📍 ${p.room || p.aud || "—"}</span>
                                    </div>
                                    <p class="text-xs font-bold text-slate-200 line-clamp-1">${p.subject || p.name}</p>
                                </div>
                            `)
                            .join("");
                    }

                    dayCol.innerHTML = `
                        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-700/50">
                            <h4 class="font-bold text-sm text-slate-200">${daysMap[dayKey]}</h4>
                            <span class="text-[11px] font-mono text-slate-400">${data?.date || ""}</span>
                        </div>
                        <div class="space-y-1">
                            ${pairsHtml}
                        </div>
                    `;
                    container.appendChild(dayCol);
                });
            }

            function reloadCurrentSchedule() {
                if (currentViewMode === "week") {
                    renderWeekGrid();
                } else {
                    loadScheduleForDay(currentDay);
                }
            }

            async function startApp() {
                const ok = await checkAppStatus();
                if (!ok) return;
                selectDay(currentDay);
                await initUserGroup();
            }

            startApp();
        </script>
    </body>
</html>
