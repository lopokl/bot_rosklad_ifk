<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Міні-додаток Розкладу</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #ffffff);
                color: var(--tg-theme-text-color, #000000);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
                cursor: pointer;
                transition: all 0.3s ease;
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #2481cc);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .pulse {
                animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            select {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
            }
            select option {
                background-color: #374151;
                color: #ffffff;
            }
        </style>
    </head>
    <body
        class="p-5 antialiased transition-colors duration-300 relative overflow-x-hidden"
    >
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">
                        Привіт, <span id="userName">Студент</span>! 👋
                    </h1>
                    <p class="text-sm opacity-60 mt-1" id="dateHeader">
                        Твій кишеньковий розклад
                    </p>
                </div>
            </div>

            <div
                class="mb-6 tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 flex justify-between items-center"
                onclick="openGroupModal()"
            >
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-wider opacity-60 mb-1"
                        >Твоя група</label
                    >
                    <div
                        class="text-xl font-bold text-blue-500 flex items-center gap-2"
                    >
                        <span id="groupName">Завантаження...</span>
                        <span class="text-sm opacity-50">🔽</span>
                    </div>
                </div>
            </div>

            <div
                class="flex space-x-2 overflow-x-auto pb-3 mb-4 scrollbar-hide"
                id="daysContainer"
            >
                <button
                    onclick="loadSchedule('mon')"
                    id="btn_mon"
                    class="day-btn tg-btn px-5 py-2.5 rounded-full whitespace-nowrap font-bold shadow-md"
                >
                    Понеділок
                </button>
                <button
                    onclick="loadSchedule('tue')"
                    id="btn_tue"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Вівторок
                </button>
                <button
                    onclick="loadSchedule('wed')"
                    id="btn_wed"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Середа
                </button>
                <button
                    onclick="loadSchedule('thu')"
                    id="btn_thu"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Четвер
                </button>
                <button
                    onclick="loadSchedule('fri')"
                    id="btn_fri"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    П'ятниця
                </button>
                <button
                    onclick="loadSchedule('sat')"
                    id="btn_sat"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Субота
                </button>
            </div>

            <div id="scheduleContainer" class="space-y-3 pb-10"></div>
        </div>

        <div
            id="groupModalOverlay"
            class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300"
        >
            <div
                class="tg-card w-full max-w-xs rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300"
                id="groupModalContent"
            >
                <h2 class="text-xl font-bold mb-4 text-center">
                    Оберіть вашу групу
                </h2>
                <div class="relative mb-6">
                    <select
                        id="groupSelect"
                        class="w-full p-4 rounded-xl bg-gray-500/10 border border-gray-500/20 outline-none text-lg font-bold text-center cursor-pointer"
                    >
                        <option value="101-К">101-К</option>
                        <option value="102-К">102-К</option>
                        <option value="201-К">201-К</option>
                        <option value="306-К">306-К</option>
                        <option value="307-К">307-К</option>
                    </select>
                    <div
                        class="pointer-events-none absolute inset-y-0 right-4 flex items-center"
                    >
                        <span class="opacity-50">▼</span>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button
                        onclick="closeGroupModal()"
                        class="w-1/2 py-3 rounded-xl font-bold bg-gray-500/20 opacity-80 hover:opacity-100"
                    >
                        Скасувати
                    </button>
                    <button
                        onclick="saveGroupFromModal()"
                        class="w-1/2 py-3 rounded-xl font-bold tg-btn shadow-md"
                        id="saveGroupBtn"
                    >
                        Зберегти
                    </button>
                </div>
            </div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            let currentUserId = tg.initDataUnsafe?.user?.id || "0";
            let currentDay = "mon";

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById("userName").textContent =
                    tg.initDataUnsafe.user.first_name;
            }

            // ==========================================
            // 📚 ТВОЇ ГЛОБАЛЬНІ НОТАТКИ (Про викладачів)
            // ==========================================
            const subjectDetails = {
              .
            };

            // --- 1. ЗАВАНТАЖЕННЯ РОЗКЛАДУ ---
            async function loadSchedule(dayKey) {
                currentDay = dayKey;
                const container = document.getElementById("scheduleContainer");

                document.querySelectorAll(".day-btn").forEach((btn) => {
                    btn.classList.remove("tg-btn", "font-bold", "shadow-md");
                    btn.classList.add("tg-card", "font-medium", "opacity-80");
                });
                document
                    .getElementById("btn_" + dayKey)
                    .classList.add("tg-btn", "font-bold", "shadow-md");
                document
                    .getElementById("btn_" + dayKey)
                    .classList.remove("tg-card", "font-medium", "opacity-80");

                container.innerHTML = `<div class="tg-card p-4 rounded-2xl opacity-50 pulse text-center font-bold">Оновлюю дані...</div>`;

                try {
                    const response = await fetch(
                        `/api/get-schedule?userId=${currentUserId}&day=${dayKey}`,
                    );
                    const data = await response.json();

                    document.getElementById("groupName").textContent =
                        data.group || "Не обрано";
                    document.getElementById("dateHeader").textContent =
                        `Розклад на ${data.date}`;

                    if (!data.schedule || data.schedule.length === 0) {
                        container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">🎉 Пар немає!</div>`;
                        return;
                    }

                    // Малюємо картки
                    container.innerHTML = data.schedule
                        .map((pair, index) => {
                            if (
                                pair.name === "Немає" ||
                                pair.name === "Вікно"
                            ) {
                                return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 opacity-40">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2 py-0.5 bg-gray-500/20 rounded-md">Пара ${pair.pair}</span>
                                <span class="text-xs font-bold">${pair.time}</span>
                            </div>
                            <h3 class="font-bold text-lg">🪟 Вікно</h3>
                        </div>`;
                            }

                            const extraInfo =
                                subjectDetails[pair.name] ||
                                "💡 Додаткової інформації про предмет поки немає.";
                            const safeName = pair.name.replace(/'/g, "\\'"); // Безпечне ім'я для JS

                            return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 border-l-4 border-l-blue-500 transform origin-top" onclick="toggleCard(this, '${safeName}', ${index})">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2 py-0.5 bg-blue-500/20 text-blue-500 rounded-md">Пара ${pair.pair}</span>
                                <span class="text-xs opacity-60 font-bold">${pair.time}</span>
                            </div>

                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-lg leading-tight mb-1 pr-4">${pair.name}</h3>
                                <span class="opacity-50 text-xs chevron transition-transform duration-300">▼</span>
                            </div>

                            <div class="flex justify-between items-end mt-2">
                                <p class="text-sm opacity-80">${pair.type}</p>
                                <div class="text-sm font-bold opacity-80">🚪 ${pair.aud}</div>
                            </div>

                            <div class="extra-info hidden mt-4 pt-3 border-t border-gray-500/20 text-sm opacity-90">
                                <div class="whitespace-pre-line leading-relaxed mb-4">${extraInfo}</div>

                                <div class="bg-black/5 p-3 rounded-xl border border-gray-500/10" onclick="event.stopPropagation()">
                                    <p class="text-xs font-bold uppercase tracking-wider opacity-60 mb-2">📝 Моє ДЗ / Нотатки</p>
                                    <textarea id="noteInput_${index}" rows="2" class="w-full p-2 rounded-lg bg-white/50 border border-gray-500/20 text-sm outline-none focus:border-blue-500 mb-2 text-black" placeholder="Що задали?"></textarea>
                                    <button id="saveBtn_${index}" onclick="saveUserNote(event, '${safeName}', ${index})" class="w-full py-2 bg-blue-500/10 text-blue-600 font-bold rounded-lg text-xs hover:bg-blue-500/20 transition-colors">Зберегти нотатку</button>
                                </div>
                            </div>
                        </div>`;
                        })
                        .join("");
                } catch (err) {
                    container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">Помилка з'єднання</div>`;
                }
            }

            // --- 2. ЛОГІКА АКОРДЕОНА І ЗАВАНТАЖЕННЯ НОТАТКИ ---
            async function toggleCard(cardElement, subjectName, index) {
                const extraInfo = cardElement.querySelector(".extra-info");
                const chevron = cardElement.querySelector(".chevron");
                const textarea = document.getElementById("noteInput_" + index);

                if (extraInfo.classList.contains("hidden")) {
                    // Відкриваємо картку
                    extraInfo.classList.remove("hidden");
                    cardElement.classList.add(
                        "scale-[1.02]",
                        "shadow-lg",
                        "my-2",
                    );
                    chevron.style.transform = "rotate(180deg)";

                    // Якщо нотатку ще не завантажили з бази - вантажимо її
                    if (textarea.getAttribute("data-loaded") !== "true") {
                        textarea.value = "⏳ Завантаження...";
                        try {
                            const res = await fetch(
                                `/api/notes?userId=${currentUserId}&subject=${encodeURIComponent(subjectName)}`,
                            );
                            const data = await res.json();
                            textarea.value = data.note || "";
                            textarea.setAttribute("data-loaded", "true");
                        } catch (e) {
                            textarea.value = "";
                        }
                    }
                } else {
                    // Закриваємо картку
                    extraInfo.classList.add("hidden");
                    cardElement.classList.remove(
                        "scale-[1.02]",
                        "shadow-lg",
                        "my-2",
                    );
                    chevron.style.transform = "rotate(0deg)";
                }
            }

            // --- 3. ЗБЕРЕЖЕННЯ ОСОБИСТОЇ НОТАТКИ ---
            async function saveUserNote(event, subjectName, index) {
                event.stopPropagation(); // Не дає картці закритися при кліку на кнопку
                const noteText = document.getElementById(
                    "noteInput_" + index,
                ).value;
                const btn = document.getElementById("saveBtn_" + index);

                btn.innerText = "⏳ Збереження...";
                try {
                    await fetch("/api/notes", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            userId: currentUserId,
                            subject: subjectName,
                            note: noteText,
                        }),
                    });
                    btn.innerText = "✅ Збережено";
                    setTimeout(
                        () => (btn.innerText = "Зберегти нотатку"),
                        2000,
                    );
                } catch (e) {
                    btn.innerText = "❌ Помилка";
                }
            }

            // --- 4. ВІДМАЛЬОВКА МОДАЛКИ ДЛЯ ГРУПИ (БЕЗ СЕРВЕРА) ---
            function openGroupModal() {
                const overlay = document.getElementById("groupModalOverlay");
                const content = document.getElementById("groupModalContent");
                const select = document.getElementById("groupSelect");

                // Встановлюємо поточну групу в селект
                const currentGroup =
                    document.getElementById("groupName").textContent;
                if (
                    Array.from(select.options).some(
                        (opt) => opt.value === currentGroup,
                    )
                ) {
                    select.value = currentGroup;
                }

                // Показуємо вікно з анімацією
                overlay.classList.remove("hidden");
                setTimeout(() => {
                    overlay.classList.remove("opacity-0");
                    content.classList.remove("scale-95");
                }, 10);
            }

            function closeGroupModal() {
                const overlay = document.getElementById("groupModalOverlay");
                const content = document.getElementById("groupModalContent");
                overlay.classList.add("opacity-0");
                content.classList.add("scale-95");
                setTimeout(() => overlay.classList.add("hidden"), 300);
            }

            async function saveGroupFromModal() {
                const newGroup = document.getElementById("groupSelect").value;
                const btn = document.getElementById("saveGroupBtn");
                btn.innerText = "⏳...";
                btn.disabled = true;

                try {
                    document.getElementById("groupName").textContent =
                        "Оновлення...";
                    await fetch("/api/save-group", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            userId: currentUserId,
                            group: newGroup,
                        }),
                    });
                    closeGroupModal();
                    loadSchedule(currentDay);
                } catch (e) {
                    alert("Помилка збереження!");
                } finally {
                    btn.innerText = "Зберегти";
                    btn.disabled = false;
                }
            }

            loadSchedule("mon");
        </script>
    </body>
</html>
