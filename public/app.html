<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Міні-додаток Розкладу</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* АВТОМАТИЧНА ТЕМА TELEGRAM */
            body {
                background-color: var(--tg-theme-bg-color, #ffffff);
                color: var(--tg-theme-text-color, #000000);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #2481cc);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            /* Ховаємо смугу прокрутки, але залишаємо скрол */
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        </style>
    </head>
    <body class="p-5 antialiased transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">
                        Привіт, <span id="userName">Студент</span>! 👋
                    </h1>
                    <p class="text-sm opacity-60 mt-1">
                        Твій кишеньковий розклад
                    </p>
                </div>
            </div>

            <div
                class="mb-6 tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10"
            >
                <label
                    class="block text-xs font-bold uppercase tracking-wider opacity-60 mb-2"
                    >Твоя група</label
                >
                <div class="flex gap-3">
                    <input
                        type="text"
                        id="groupInput"
                        value="307-К"
                        class="w-full bg-transparent border-b-2 border-gray-400 focus:border-blue-500 outline-none pb-1 text-xl font-bold transition-colors"
                    />
                    <button
                        class="tg-btn px-5 py-2 rounded-xl font-bold shadow-md hover:opacity-90 transition-opacity"
                    >
                        Зберегти
                    </button>
                </div>
            </div>

            <div
                class="flex space-x-2 overflow-x-auto pb-3 mb-4 scrollbar-hide"
            >
                <button
                    class="tg-btn px-5 py-2.5 rounded-full whitespace-nowrap font-bold shadow-md transform scale-105 transition-transform"
                >
                    Понеділок
                </button>
                <button
                    class="tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80 hover:opacity-100 transition-opacity"
                >
                    Вівторок
                </button>
                <button
                    class="tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80 hover:opacity-100 transition-opacity"
                >
                    Середа
                </button>
                <button
                    class="tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80 hover:opacity-100 transition-opacity"
                >
                    Четвер
                </button>
                <button
                    class="tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80 hover:opacity-100 transition-opacity"
                >
                    П'ятниця
                </button>
            </div>

            <div id="scheduleContainer" class="space-y-3">
                <div
                    class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10"
                >
                    <div class="flex justify-between items-center mb-3">
                        <span
                            class="text-xs font-bold px-2.5 py-1 bg-blue-500/20 text-blue-500 rounded-lg"
                            >Пара 1</span
                        >
                        <span class="text-xs opacity-60 font-bold tracking-wide"
                            >08:30 - 09:50</span
                        >
                    </div>
                    <h3 class="font-bold text-lg mb-1 leading-tight">
                        Основи програмування
                    </h3>
                    <p class="text-sm opacity-80 mb-3">📢 Лекція</p>
                    <div class="flex items-center text-sm font-bold opacity-80">
                        <span class="mr-2 text-lg">🚪</span> Ауд: 305
                    </div>
                </div>

                <div
                    class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 opacity-50"
                >
                    <div class="flex justify-between items-center mb-3">
                        <span
                            class="text-xs font-bold px-2.5 py-1 bg-gray-500/20 text-gray-500 rounded-lg"
                            >Пара 2</span
                        >
                        <span class="text-xs font-bold tracking-wide"
                            >10:05 - 11:25</span
                        >
                    </div>
                    <h3 class="font-bold text-lg mb-1">🪟 Вікно</h3>
                </div>
            </div>
        </div>

        <script>
            // Ініціалізація Telegram Web App
            const tg = window.Telegram.WebApp;

            // Кажемо додатку розгорнутися на весь екран
            tg.expand();

            // Кажемо додатку, що ми готові (прибирає лоадер)
            tg.ready();

            // Магія: беремо реальне ім'я користувача з його профілю Telegram!
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById("userName").textContent =
                    tg.initDataUnsafe.user.first_name;
            }
        </script>
    </body>
</html>
