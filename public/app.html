<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Міні-додаток Розкладу</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #ffffff);
                color: var(--tg-theme-text-color, #000000);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #2481cc);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            /* Анімація завантаження */
            .pulse {
                animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
        </style>
    </head>
    <body class="p-5 antialiased transition-colors duration-300">
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">
                        Привіт, <span id="userName">Студент</span>! 👋
                    </h1>
                    <p class="text-sm opacity-60 mt-1" id="dateHeader">
                        Твій кишеньковий розклад
                    </p>
                </div>
            </div>

            <div
                class="mb-6 tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10"
            >
                <label
                    class="block text-xs font-bold uppercase tracking-wider opacity-60 mb-2"
                    >Твоя група</label
                >
                <div class="text-xl font-bold text-blue-500" id="groupName">
                    Завантаження...
                </div>
            </div>

            <div
                class="flex space-x-2 overflow-x-auto pb-3 mb-4 scrollbar-hide"
                id="daysContainer"
            >
                <button
                    onclick="loadSchedule('mon')"
                    id="btn_mon"
                    class="day-btn tg-btn px-5 py-2.5 rounded-full whitespace-nowrap font-bold shadow-md"
                >
                    Понеділок
                </button>
                <button
                    onclick="loadSchedule('tue')"
                    id="btn_tue"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Вівторок
                </button>
                <button
                    onclick="loadSchedule('wed')"
                    id="btn_wed"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Середа
                </button>
                <button
                    onclick="loadSchedule('thu')"
                    id="btn_thu"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Четвер
                </button>
                <button
                    onclick="loadSchedule('fri')"
                    id="btn_fri"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    П'ятниця
                </button>
            </div>

            <div id="scheduleContainer" class="space-y-3"></div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            let currentUserId = "0"; // Дефолт для тестів
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById("userName").textContent =
                    tg.initDataUnsafe.user.first_name;
                currentUserId = tg.initDataUnsafe.user.id;
            }

            async function loadSchedule(dayKey) {
                const container = document.getElementById("scheduleContainer");

                // Оновлюємо кнопки (активна - синя, інші - сірі)
                document.querySelectorAll(".day-btn").forEach((btn) => {
                    btn.classList.remove("tg-btn", "font-bold", "shadow-md");
                    btn.classList.add("tg-card", "font-medium", "opacity-80");
                });
                const activeBtn = document.getElementById("btn_" + dayKey);
                activeBtn.classList.remove(
                    "tg-card",
                    "font-medium",
                    "opacity-80",
                );
                activeBtn.classList.add("tg-btn", "font-bold", "shadow-md");

                // Показуємо завантаження
                container.innerHTML = `<div class="tg-card p-4 rounded-2xl opacity-50 pulse text-center font-bold">Оновлюю дані...</div>`;

                try {
                    // РОБИМО ЗАПИТ ДО НАШОГО БЕКЕНДУ!
                    const response = await fetch(
                        `/api/get-schedule?userId=${currentUserId}&day=${dayKey}`,
                    );
                    const data = await response.json();

                    if (data.error) {
                        container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-red-500 font-bold text-center border border-red-500/30">❌ ${data.error}</div>`;
                        return;
                    }

                    document.getElementById("groupName").textContent =
                        data.group;
                    document.getElementById("dateHeader").textContent =
                        `Розклад на ${data.date}`;

                    if (!data.schedule || data.schedule.length === 0) {
                        container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">🎉 На цей день пар немає!</div>`;
                        return;
                    }

                    // Малюємо картки пар
                    container.innerHTML = data.schedule
                        .map((pair) => {
                            if (pair.name === "Вікно") {
                                return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 opacity-50">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold px-2.5 py-1 bg-gray-500/20 text-gray-500 rounded-lg">Пара ${pair.pair}</span>
                                <span class="text-xs font-bold tracking-wide">${pair.time}</span>
                            </div>
                            <h3 class="font-bold text-lg mb-1">🪟 Немає</h3>
                        </div>`;
                            }
                            return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold px-2.5 py-1 bg-blue-500/20 text-blue-500 rounded-lg">Пара ${pair.pair}</span>
                                <span class="text-xs opacity-60 font-bold tracking-wide">${pair.time}</span>
                            </div>
                            <h3 class="font-bold text-lg mb-1 leading-tight">${pair.name}</h3>
                            <p class="text-sm opacity-80 mb-3">${pair.type}</p>
                            <div class="flex items-center text-sm font-bold opacity-80">
                                <span class="mr-2 text-lg">🚪</span> Ауд: ${pair.aud}
                            </div>
                        </div>`;
                        })
                        .join("");
                } catch (err) {
                    container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">Помилка з'єднання з сервером.</div>`;
                }
            }

            // При запуску завантажуємо понеділок
            loadSchedule("mon");
        </script>
    </body>
</html>
