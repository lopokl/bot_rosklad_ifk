<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Міні-додаток Розкладу</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #ffffff);
                color: var(--tg-theme-text-color, #000000);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
                cursor: pointer;
                transition: all 0.3s ease;
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #2481cc);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .pulse {
                animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
        </style>
    </head>
    <body
        class="p-5 antialiased transition-colors duration-300 relative overflow-x-hidden"
    >
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight">
                        Привіт, <span id="userName">Студент</span>! 👋
                    </h1>
                    <p class="text-sm opacity-60 mt-1" id="dateHeader">
                        Твій кишеньковий розклад
                    </p>
                </div>
            </div>

            <div
                class="mb-6 tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 flex justify-between items-center"
                onclick="editGroup()"
            >
                <div>
                    <label
                        class="block text-xs font-bold uppercase tracking-wider opacity-60 mb-1"
                        >Твоя група</label
                    >
                    <div
                        class="text-xl font-bold text-blue-500 flex items-center gap-2"
                    >
                        <span id="groupName">Завантаження...</span>
                        <span class="text-sm opacity-50">✏️</span>
                    </div>
                </div>
            </div>

            <div
                class="flex space-x-2 overflow-x-auto pb-3 mb-4 scrollbar-hide"
                id="daysContainer"
            >
                <button
                    onclick="loadSchedule('mon')"
                    id="btn_mon"
                    class="day-btn tg-btn px-5 py-2.5 rounded-full whitespace-nowrap font-bold shadow-md"
                >
                    Пн
                </button>
                <button
                    onclick="loadSchedule('tue')"
                    id="btn_tue"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Вв
                </button>
                <button
                    onclick="loadSchedule('wed')"
                    id="btn_wed"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Ср
                </button>
                <button
                    onclick="loadSchedule('thu')"
                    id="btn_thu"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Чт
                </button>
                <button
                    onclick="loadSchedule('fri')"
                    id="btn_fri"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Пт
                </button>
                <button
                    onclick="loadSchedule('sat')"
                    id="btn_sat"
                    class="day-btn tg-card px-5 py-2.5 rounded-full whitespace-nowrap font-medium opacity-80"
                >
                    Сб
                </button>
            </div>

            <div id="scheduleContainer" class="space-y-3 pb-10"></div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            let currentUserId = tg.initDataUnsafe?.user?.id || "0";
            let currentDay = "mon";

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById("userName").textContent =
                    tg.initDataUnsafe.user.first_name;
            }

            // ==========================================
            // 📚 ТУТ ТИ ПИШЕШ СВОЇ НОТАТКИ (СЛОВНИК)
            // ==========================================
            const subjectDetails = {
                "Основи програмування":
                    "👨‍🏫 Викладач: Іванов І.І.\n💻 Кафедра комп'ютерних наук\n🔗 Zoom: https://zoom.us/j/12345",
                "Вища математика":
                    "👩‍🏫 Викладач: Петрова О.М.\n📝 Не забути зошит на 48 аркушів!",
                "Історія України":
                    "👨‍🏫 Викладач: Шевченко В.І.\n📖 Читати конспект перед парою.",
                // Додавай сюди інші предмети за таким самим зразком!
            };

            // --- 1. ЗАВАНТАЖЕННЯ РОЗКЛАДУ ---
            async function loadSchedule(dayKey) {
                currentDay = dayKey;
                const container = document.getElementById("scheduleContainer");

                document.querySelectorAll(".day-btn").forEach((btn) => {
                    btn.classList.remove("tg-btn", "font-bold", "shadow-md");
                    btn.classList.add("tg-card", "font-medium", "opacity-80");
                });
                const activeBtn = document.getElementById("btn_" + dayKey);
                activeBtn.classList.remove(
                    "tg-card",
                    "font-medium",
                    "opacity-80",
                );
                activeBtn.classList.add("tg-btn", "font-bold", "shadow-md");

                container.innerHTML = `<div class="tg-card p-4 rounded-2xl opacity-50 pulse text-center font-bold">Оновлюю дані...</div>`;

                try {
                    const response = await fetch(
                        `/api/get-schedule?userId=${currentUserId}&day=${dayKey}`,
                    );
                    const data = await response.json();

                    if (data.error) {
                        container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-red-500 font-bold text-center">❌ ${data.error}</div>`;
                        return;
                    }

                    document.getElementById("groupName").textContent =
                        data.group;
                    document.getElementById("dateHeader").textContent =
                        `Розклад на ${data.date}`;

                    if (!data.schedule || data.schedule.length === 0) {
                        container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">🎉 Пар немає!</div>`;
                        return;
                    }

                    container.innerHTML = data.schedule
                        .map((pair) => {
                            if (
                                pair.name === "Немає" ||
                                pair.name === "Вікно"
                            ) {
                                return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 opacity-40">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2 py-0.5 bg-gray-500/20 rounded-md">Пара ${pair.pair}</span>
                                <span class="text-xs font-bold">${pair.time}</span>
                            </div>
                            <h3 class="font-bold text-lg">🪟 Вікно</h3>
                        </div>`;
                            }

                            // Беремо інфу зі словника
                            const extraInfo =
                                subjectDetails[pair.name] ||
                                "💡 Додаткової інформації про викладача поки немає.";

                            // КЛІКАБЕЛЬНА КАРТКА (АКОРДЕОН)
                            return `
                        <div class="tg-card p-4 rounded-2xl shadow-sm border border-gray-500/10 border-l-4 border-l-blue-500 transform origin-top" onclick="toggleCard(this)">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold px-2 py-0.5 bg-blue-500/20 text-blue-500 rounded-md">Пара ${pair.pair}</span>
                                <span class="text-xs opacity-60 font-bold">${pair.time}</span>
                            </div>

                            <div class="flex justify-between items-center">
                                <h3 class="font-bold text-lg leading-tight mb-1 pr-4">${pair.name}</h3>
                                <span class="opacity-50 text-xs chevron transition-transform duration-300">▼</span>
                            </div>

                            <div class="flex justify-between items-end mt-2">
                                <p class="text-sm opacity-80">${pair.type}</p>
                                <div class="text-sm font-bold opacity-80">🚪 ${pair.aud}</div>
                            </div>

                            <div class="extra-info hidden mt-4 pt-3 border-t border-gray-500/20 text-sm opacity-90 whitespace-pre-line leading-relaxed">
                                ${extraInfo}
                            </div>
                        </div>`;
                        })
                        .join("");
                } catch (err) {
                    container.innerHTML = `<div class="tg-card p-4 rounded-2xl text-center opacity-70">Помилка з'єднання</div>`;
                }
            }

            // --- 2. ЛОГІКА АКОРДЕОНА ---
            function toggleCard(cardElement) {
                const extraInfo = cardElement.querySelector(".extra-info");
                const chevron = cardElement.querySelector(".chevron");

                if (extraInfo.classList.contains("hidden")) {
                    extraInfo.classList.remove("hidden");
                    cardElement.classList.add(
                        "scale-[1.03]",
                        "shadow-lg",
                        "my-2",
                    );
                    chevron.style.transform = "rotate(180deg)";
                } else {
                    extraInfo.classList.add("hidden");
                    cardElement.classList.remove(
                        "scale-[1.03]",
                        "shadow-lg",
                        "my-2",
                    );
                    chevron.style.transform = "rotate(0deg)";
                }
            }

            // --- 3. ЛОГІКА ЗМІНИ ГРУПИ ---
            function editGroup() {
                tg.showPopup(
                    {
                        title: "Зміна групи",
                        message: "Введіть назву вашої нової групи:",
                        buttons: [
                            { id: "cancel", type: "cancel" },
                            { id: "ok", type: "default", text: "Готово" },
                        ],
                    },
                    async function (buttonId) {
                        if (buttonId === "ok") {
                            const newGroup = prompt("Введіть групу:");
                            if (newGroup && newGroup.trim() !== "") {
                                document.getElementById(
                                    "groupName",
                                ).textContent = "Оновлення...";
                                await fetch("/api/save-group", {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify({
                                        userId: currentUserId,
                                        group: newGroup,
                                    }),
                                });
                                loadSchedule(currentDay); // Перемальовуємо розклад
                            }
                        }
                    },
                );
            }

            loadSchedule("mon");
        </script>
    </body>
</html>
