<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Адмін Панель</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                background-color: var(--tg-theme-bg-color, #1f2937);
                color: var(--tg-theme-text-color, #ffffff);
            }
            .tg-card {
                background-color: var(--tg-theme-secondary-bg-color, #374151);
            }
            .tg-btn {
                background-color: var(--tg-theme-button-color, #3b82f6);
                color: var(--tg-theme-button-text-color, #ffffff);
            }
            .pulse {
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
            /* Ховаємо некрасивий скроллбар */
            .custom-scroll::-webkit-scrollbar {
                width: 4px;
            }
            .custom-scroll::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 4px;
            }
        </style>
    </head>
    <body class="p-5 antialiased">
        <div class="max-w-md mx-auto pb-10">
            <h1 class="text-2xl font-extrabold mb-2 text-red-500">
                👑 Панель Адміна
            </h1>
            <p class="text-sm opacity-70 mb-6">Аналітика та керування ботом.</p>

            <h2
                class="font-bold mb-3 uppercase tracking-wider text-xs opacity-60"
            >
                📈 Аналітика
            </h2>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="tg-card p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs opacity-70 mb-1">Всього юзерів</p>
                    <p class="text-3xl font-black text-blue-400" id="statUsers">
                        ...
                    </p>
                </div>
                <div class="tg-card p-4 rounded-2xl shadow-sm text-center">
                    <p class="text-xs opacity-70 mb-1">Будильник ON</p>
                    <p
                        class="text-3xl font-black text-green-400"
                        id="statNotif"
                    >
                        ...
                    </p>
                </div>
            </div>

            <h2
                class="font-bold mb-3 uppercase tracking-wider text-xs opacity-60"
            >
                📚 Статистика по групах
            </h2>
            <div
                class="tg-card p-4 rounded-2xl shadow-sm mb-6 max-h-48 overflow-y-auto custom-scroll"
            >
                <div
                    id="statGroups"
                    class="text-sm font-medium space-y-2 pulse"
                >
                    Завантаження...
                </div>
            </div>

            <h2
                class="font-bold mb-3 uppercase tracking-wider text-xs opacity-60"
            >
                📊 Відвідуваність (7 днів)
            </h2>
            <div class="tg-card p-4 rounded-2xl shadow-sm mb-6">
                <canvas id="activityChart" height="200"></canvas>
            </div>

            <h2
                class="font-bold mb-3 uppercase tracking-wider text-xs opacity-60"
            >
                🕵️ Хто відкривав бота
            </h2>
            <div class="tg-card p-4 rounded-2xl shadow-sm mb-6">
                <div
                    id="recentLogs"
                    class="text-[11px] font-mono opacity-80 space-y-1 max-h-40 overflow-y-auto custom-scroll"
                >
                    ⏳ Завантаження логів...
                </div>
            </div>

            <h2
                class="font-bold mb-3 uppercase tracking-wider text-xs opacity-60"
            >
                ✉️ Повідомлення
            </h2>
            <div class="tg-card p-4 rounded-2xl shadow-sm mb-4">
                <textarea
                    id="broadcastMsg"
                    rows="3"
                    class="w-full p-3 rounded-xl bg-black/20 border border-gray-500/30 outline-none focus:border-blue-500 mb-3 text-sm"
                    placeholder="Введіть текст оголошення..."
                ></textarea>
                <button
                    id="sendBtn"
                    onclick="sendBroadcast()"
                    class="tg-btn w-full py-3 rounded-xl font-bold shadow-md"
                >
                    Відправити всім
                </button>
            </div>

            <div
                id="status"
                class="text-center font-bold text-sm mb-6 h-6"
            ></div>
        </div>

        <script>
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const adminId = tg.initDataUnsafe?.user?.id;
            let chartInstance = null;

            async function loadStats() {
                if (!adminId) return;
                try {
                    const res = await fetch(`/api/admin?userId=${adminId}`);
                    const data = await res.json();

                    if (data.error) {
                        document.getElementById("statGroups").innerHTML =
                            `<span class="text-red-500">${data.error}</span>`;
                        return;
                    }

                    document.getElementById("statUsers").innerText =
                        data.totalUsers || 0;
                    document.getElementById("statNotif").innerText =
                        data.notifOnCount || 0;

                    // Заповнюємо список ВСІХ груп
                    const groupsBox = document.getElementById("statGroups");
                    groupsBox.classList.remove("pulse");
                    if (data.allGroups && data.allGroups.length > 0) {
                        groupsBox.innerHTML = data.allGroups
                            .map((g, i) => {
                                let parts = g.split(" — ");
                                return `<div class="flex justify-between border-b border-gray-500/10 pb-1">
                                    <span>${i + 1}. <span class="text-blue-400 font-bold">${parts[0]}</span></span>
                                    <span class="opacity-70">${parts[1]}</span>
                                </div>`;
                            })
                            .join("");
                    } else {
                        groupsBox.innerHTML =
                            "<p class='opacity-50'>Немає даних</p>";
                    }

                    // Заповнюємо логи
                    const logsBox = document.getElementById("recentLogs");
                    if (data.recentLogs && data.recentLogs.length > 0) {
                        logsBox.innerHTML = data.recentLogs
                            .map((log) => {
                                // Робимо ID синім для краси
                                const formattedLog = log.replace(
                                    /ID: (\d+)/,
                                    'ID: <span class="text-blue-400">$1</span>',
                                );
                                return `<p>${formattedLog}</p>`;
                            })
                            .join("");
                    } else {
                        logsBox.innerHTML = "<p>Ще ніхто не заходив</p>";
                    }

                    // Малюємо графік
                    const ctx = document
                        .getElementById("activityChart")
                        .getContext("2d");
                    if (chartInstance) chartInstance.destroy();
                    chartInstance = new Chart(ctx, {
                        type: "line",
                        data: {
                            labels: data.chartLabels,
                            datasets: [
                                {
                                    label: "Відкрито розклад",
                                    data: data.chartData,
                                    borderColor: "#3b82f6",
                                    backgroundColor: "rgba(59, 130, 246, 0.2)",
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.4,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1,
                                        color: "rgba(255,255,255,0.6)",
                                    },
                                },
                                x: {
                                    ticks: { color: "rgba(255,255,255,0.6)" },
                                },
                            },
                        },
                    });
                } catch (e) {
                    console.error(e);
                }
            }

            async function sendBroadcast() {
                const msg = document.getElementById("broadcastMsg").value;
                const btn = document.getElementById("sendBtn");
                const status = document.getElementById("status");
                if (!msg.trim()) {
                    tg.showAlert("Введіть текст!");
                    return;
                }
                if (!adminId) {
                    status.innerHTML = `<span class="text-red-500">Помилка ID</span>`;
                    return;
                }

                btn.disabled = true;
                btn.innerText = "⏳...";
                btn.classList.add("opacity-50");
                try {
                    const response = await fetch("/api/admin", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userId: adminId, message: msg }),
                    });
                    const data = await response.json();
                    if (data.error) status.innerHTML = `❌ ${data.error}`;
                    else {
                        status.innerHTML = `✅ Відправлено ${data.count} юзерам!`;
                        document.getElementById("broadcastMsg").value = "";
                    }
                } catch (err) {
                    status.innerHTML = `❌ Помилка з'єднання`;
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Відправити всім";
                    btn.classList.remove("opacity-50");
                }
                setTimeout(() => (status.innerHTML = ""), 5000);
            }

            loadStats();
        </script>
    </body>
</html>
